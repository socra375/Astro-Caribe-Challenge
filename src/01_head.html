<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Space Explorer: simulador educativo 2D para aprender a gestionar un puesto avanzado en la Luna o Marte.">
<title>Space Explorer</title>
<style>
/* ===== Design tokens (roles). Contrast checked with tests/contrast.js ===== */
:root{
  --bg:#070b1a; --surface:#111a33; --surface-2:#18244a; --border:#2c3d70; --border-input:#5a73b8;
  --text:#eef3ff; --text-muted:#b4c0e0; --accent:#38d6ff; --on-accent:#04121c;
  --danger:#ff6b6b; --warning:#ffc24a; --info:#6fb3ff; --success:#5fe39a;
  --radius:10px; --radius-lg:16px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-xxl:40px;
  --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(var(--fs-md)*var(--scale));overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0}
#layer{position:absolute;inset:0;z-index:20;pointer-events:none}#layer>*{pointer-events:auto}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#02040c}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Buttons ===== */
.btn{appearance:none;border:2px solid var(--border-input);background:var(--surface-2);border-radius:var(--radius);padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;line-height:1.2;transition:transform .08s,background .15s}
.btn:hover{background:#22315f}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:#7fe6ff}
.btn.danger{border-color:var(--danger);color:#ffd9d9}
.btn.sm{min-height:36px;padding:6px 10px;font-size:var(--fs-sm)}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--text-muted)}
.small{font-size:var(--fs-sm)}
.tag{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:var(--fs-sm);border:1px solid var(--border-input);background:var(--surface)}
.tag.crit{border-color:var(--danger);color:#ffd2d2}
.tag.warn{border-color:var(--warning);color:#ffe7b3}
.tag.info{border-color:var(--info);color:#d6e8ff}
.tag.ok{border-color:var(--success);color:#cbf7dd}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.card h3{margin:0 0 8px;font-size:var(--fs-lg)}
h2{font-size:var(--fs-xl);margin:0 0 10px}
p{line-height:1.45;margin:6px 0}
ul{margin:6px 0;padding-left:20px;line-height:1.45}
label{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
select{background:var(--surface-2);border:2px solid var(--border-input);border-radius:var(--radius);padding:8px;min-height:44px}

/* ===== HUD ===== */
/* ===== EARTHLINK RADIO ===== */
.er{position:absolute;right:8px;top:112px;bottom:8px;width:min(420px,calc(100vw - 16px));z-index:30;display:flex;flex-direction:column;pointer-events:auto}
.er.hidden{display:none}
.er-dev{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:linear-gradient(160deg,#1a2342,#0c1228 60%,#131a36);border:2px solid #3b4a86;border-radius:22px;padding:14px 12px 10px;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 0 2px rgba(127,211,255,.08)}
.er.er-in .er-dev{animation:erOpen .45s cubic-bezier(.2,.9,.3,1)}
@keyframes erOpen{0%{transform:translate(40px,-30px) scale(.55);opacity:0;filter:brightness(2)}60%{opacity:1}100%{transform:none;filter:none}}
.er-ant{position:absolute;right:26px;top:-22px;width:10px;height:30px;border-radius:5px 5px 0 0;background:linear-gradient(#cfd5e3,#6a7390);border:2px solid #3b4a86;border-bottom:none}
.er-head{display:flex;align-items:center;gap:8px;padding-right:2px}
.er-led{width:12px;height:12px;border-radius:50%;background:#6fffa0;flex:0 0 auto}
.er-brand{letter-spacing:.14em;font-size:14px}
.er-freq{flex:1;min-width:0;font:600 11px ui-monospace,Menlo,Consolas,monospace;color:#9fe8ff;background:#050a1c;border:1px solid #2b3a70;border-radius:6px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-bars{display:inline-flex;gap:2px;align-items:flex-end;height:18px} .er-bars i{width:4px;background:#3a4570;display:block;border-radius:1px} .er-bars i.on{background:var(--success)}
.er-top{display:flex;gap:8px;align-items:stretch}
.er-dev>*{flex:none}.er-dev>.er-mid{flex:1 1 auto;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.er-earth{width:170px;height:120px;border-radius:12px;border:1px solid #2b3a70;flex:0 0 auto;image-rendering:auto}
.er-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px}
.er-center{font-weight:700;font-size:12px}
.er-state{font-weight:700;border:1px solid;border-radius:8px;padding:1px 6px;align-self:flex-start;font-size:11px}
.er-row{color:var(--text-muted);line-height:1.25}
.er-chs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.er-ch{display:flex;align-items:center;gap:5px;justify-content:center;position:relative;min-height:36px;padding:3px 4px;border-radius:10px;border:1px solid #2b3a70;background:#10183a;color:var(--text);font:600 12px system-ui;cursor:pointer}
.er-ch.on{background:#1d3470;border-color:#7fd3ff;box-shadow:0 0 0 1px #7fd3ff inset}
.er-ic{display:inline-flex;width:16px;height:16px} .er-badge{position:absolute;right:-3px;top:-5px;background:#ff6b6b;color:#fff;border-radius:9px;min-width:17px;height:17px;font:700 11px/17px system-ui;text-align:center;font-style:normal}
.er-sub{display:flex;align-items:center;gap:8px;background:#050a1c;border:1px solid #2b3a70;border-radius:10px;padding:6px 8px;min-height:50px}
.er-who{font-size:12px;min-width:62px} .er-txled{width:9px;height:9px;border-radius:50%;background:#3a4570;flex:0 0 auto} .er-txled.on{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
.er-subtxt{flex:1;font-size:13px;line-height:1.35;min-height:18px}
.er-props{display:flex;flex-direction:column;gap:4px} .er-prop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;font-size:12px;border:1px dashed #ffc24a;border-radius:10px;padding:5px 8px;background:rgba(255,194,74,.07)}
.er-opts{display:flex;flex-direction:column;gap:5px}
.er .er-opt{display:flex;justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:1px;min-height:40px;font-size:13px;padding:6px 10px}
.er-opt.off{opacity:.55}
.er-hh{display:flex;justify-content:space-between;align-items:center;font-size:12px;border-top:1px solid #2b3a70;padding-top:6px}
.er-hist{display:flex;flex-direction:column;gap:5px}
.er-msg{border-radius:10px;padding:5px 8px;font-size:12px;border:1px solid #2b3a70;background:#0e1633}
.er-msg.out{border-color:#3e6fb8;background:#12224a} .er-msg.in{border-color:#2f8f62;background:#0f2a24} .er-msg.sys{border-style:dashed;color:var(--text-muted)}
.er-mh{display:flex;justify-content:space-between;align-items:center;gap:6px} .er-mt{line-height:1.35;margin-top:2px}
.er-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid #2b3a70;padding-top:6px}
.er-scale{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .er-scbtns{display:inline-flex;gap:4px}
.er-vol{display:flex;align-items:center;gap:8px} .er-vol input{flex:1;min-height:28px}
#bRadio{position:relative} #bRadio.on{outline:2px solid #7fd3ff} #bRadio .er-hb{position:absolute;right:-5px;top:-6px;min-width:17px;height:17px;border-radius:9px;color:#fff;font:700 11px/17px system-ui;text-align:center;font-style:normal}
#bRadio.pulse{animation:pulse 1s infinite}
#app.er-on #eva,#app.er-on #mini,#app.er-on #zoomc{display:none}
@media (max-width:600px){
  .er{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:min(78vh,640px)}
  .er-dev{border-radius:18px;padding:12px 10px 8px}
  .er-earth{width:128px;height:90px}
  .er-info{font-size:10px}.er-opt{min-height:36px}
  #app.er-on #touch,#app.er-on #xtools,#app.er-on #prompt,#app.er-on #xcard{display:none}
}
@media (prefers-reduced-motion:reduce){.er.er-in .er-dev{animation:none}}
.rm .er.er-in .er-dev{animation:none}
#hud{position:absolute;left:0;right:0;top:0;padding:8px max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
#hud .meters{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.meter{background:rgba(10,16,36,.88);border:1px solid var(--border);border-radius:12px;padding:5px 8px;min-width:104px;cursor:pointer}
.meter .lbl{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700}
.meter .bar{height:8px;background:#26345e;border-radius:6px;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;background:var(--success);border-radius:6px;transition:width .3s}
.meter.warn{border-color:var(--warning)} .meter.warn .bar i{background:var(--warning)}
.meter.crit{border-color:var(--danger);animation:pulse 1s infinite} .meter.crit .bar i{background:var(--danger)}
.meter .st{font-size:11px;color:var(--text-muted)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,107,107,.35)}}
#hudR{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(10,16,36,.88);border:1px solid var(--border);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;min-height:40px;display:flex;align-items:center;gap:6px}
.chip.btn{padding:6px 10px}
#zoomc{position:absolute;right:8px;bottom:166px;display:flex;flex-direction:column;gap:4px}
#zoomc.hidden{display:none}
#zoomc .chip{min-width:40px;min-height:40px;font-size:20px;justify-content:center}
#mini{position:absolute;right:8px;bottom:8px;width:190px;height:150px;border:1px solid var(--border);border-radius:12px;background:rgba(5,8,20,.85)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:min(560px,80vw);background:rgba(10,16,36,.92);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:15px;text-align:center;pointer-events:none}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:64px}
#prompt .btn{font-size:18px;box-shadow:var(--shadow)}
#toasts{position:absolute;left:8px;top:120px;display:flex;flex-direction:column;gap:6px;max-width:min(380px,70vw);pointer-events:none}
.toast{background:rgba(10,16,36,.95);border-left:6px solid var(--info);border-radius:10px;padding:8px 10px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;animation:slidein .25s}
.toast.crit{border-color:var(--danger)} .toast.warn{border-color:var(--warning)} .toast.ok{border-color:var(--success)}
.toast b{display:block}
@keyframes slidein{from{transform:translateX(-20px);opacity:0}}

/* ===== Touch ===== */
#touch{position:absolute;inset:auto 0 0 0;height:0}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(56,214,255,.12);border:2px solid rgba(56,214,255,.5)}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(56,214,255,.6)}
#btnE{position:absolute;right:24px;bottom:180px;width:84px;height:84px;border-radius:50%;font-size:24px}
#btnF{position:absolute;right:120px;bottom:190px;width:64px;height:64px;border-radius:50%;font-size:20px;pointer-events:auto}
#btnF.hidden{display:none}
#eva{position:absolute;right:8px;top:96px;width:208px;background:rgba(10,16,36,.92);border:1px solid var(--info);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px;pointer-events:auto;z-index:5}
#eva.hidden,#xtools.hidden,#xcard.hidden{display:none}
#eva .xr{display:flex;align-items:center;gap:6px}
#eva .xr b{min-width:58px;font-size:11px;white-space:nowrap}
#eva .xb{flex:1;height:7px;background:#26345e;border-radius:5px;overflow:hidden}
#eva .xb i{display:block;height:100%;width:0;background:var(--success);transition:width .2s}
#eva .xr.warn .xb i{background:var(--warning)} #eva .xr.crit .xb i{background:var(--danger)}
#eva .xr.warn .xv{color:#ffe7b3} #eva .xr.crit .xv{color:#ffb3b3;font-weight:700}
#eva .xv{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
#eva .sig{display:inline-flex;gap:2px;align-items:flex-end;height:12px;flex:1} #eva .sig i{width:4px;background:#3a4570;display:block} #eva .sig i.on{background:var(--success)}
#eva .xobj{border-top:1px solid var(--border);padding-top:5px;font-size:12px;cursor:pointer;line-height:1.3}
#xtools{position:absolute;left:8px;bottom:190px;display:flex;flex-direction:column;gap:4px;pointer-events:auto;z-index:5}
#xtools .btn{min-width:46px;min-height:46px;padding:0;font-size:20px;border-radius:12px;justify-content:center}
#xtools .btn.on{outline:2px solid var(--warning)}
#xcard{position:absolute;left:50%;transform:translateX(-50%);bottom:152px;width:min(440px,calc(100vw - 16px));background:rgba(10,16,36,.95);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:14px;z-index:5;pointer-events:none}
#xcard .small{font-size:12px;margin:2px 0}


/* ===== Teletransporte de pisos ===== */
#telefx{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(160,220,255,.9),rgba(20,30,70,.96));animation:telefade .95s ease-in-out forwards;pointer-events:none}
.telering{font-size:96px;animation:telespin .95s linear}
@keyframes telefade{0%{opacity:0}40%{opacity:1}60%{opacity:1}100%{opacity:0}}
@keyframes telespin{from{transform:rotate(0) scale(.4)}to{transform:rotate(540deg) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.telering{animation:none}}
.rm .telering{animation:none}
/* ===== Llegada y aterrizaje ===== */
#landw{position:fixed;inset:0;z-index:30;background:#02040c}
#landcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#landui{position:absolute;inset:0;pointer-events:none}
#landui>*{pointer-events:auto}
#landSkip{position:absolute;left:12px;top:12px;z-index:3;min-height:44px}
.lpanel{position:absolute;right:12px;top:12px;bottom:12px;width:min(430px,92vw);overflow:auto;background:rgba(10,16,36,.95);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.lcard{position:absolute;left:12px;bottom:12px;max-width:min(470px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:rgba(10,16,36,.93);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.lcard.dep{top:64px;bottom:auto;max-width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 140px)}
.lcard.lcen,.lcen{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);max-width:min(480px,calc(100vw - 24px))}
.lcen{position:absolute;background:rgba(10,16,36,.96);border:2px solid var(--accent);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:center}
.lbtn{position:absolute;right:16px;bottom:16px;min-height:52px;font-size:18px}
.ign{font-size:20px;min-height:56px;position:relative;background-image:conic-gradient(var(--success) calc(var(--p,0)*360deg),transparent 0)}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#26345e;margin-right:3px}
.dots i.on{background:var(--accent)}
.dsteps{margin:6px 0 0;padding-left:0;list-style:none;font-size:13px}
.dsteps li{padding:3px 0;opacity:.55}.dsteps li.done{opacity:1;color:var(--success)}.dsteps li.act{opacity:1;font-weight:700}
@media (max-width:700px){.lpanel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh}.lcard.dep{top:60px;left:8px;max-height:30vh}.lcard{left:8px;bottom:8px}.lbtn{right:8px;bottom:8px}}

/* ===== Screens & modals ===== */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 30% 20%,#1a2a5c 0,#070b1a 60%);overflow:auto}
.screen.dim{background:rgba(3,6,16,.72)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;position:relative}
.panel.narrow{width:min(560px,100%)}
.panel .close{position:absolute;right:10px;top:10px}
.title-big{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:.5px;margin:0;background:linear-gradient(90deg,#38d6ff,#a98bff,#5fe39a);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.choice{border:2px solid var(--border-input);background:var(--surface-2);border-radius:var(--radius-lg);padding:12px;text-align:left;cursor:pointer;min-height:44px}
.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,214,255,.25)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px;padding-right:44px}
.tabs .btn[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pbar{height:12px;background:#26345e;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.delta-up{color:var(--success)} .delta-down{color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th,td{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.mg-wrap{position:relative;width:100%;max-width:720px;margin:0 auto}
.mg-wrap canvas{width:100%;height:auto;background:#050915;border-radius:12px;border:1px solid var(--border);display:block;touch-action:none}
.why{border-left:4px solid var(--info);padding-left:10px}
.earth3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.earth3 .card{border-top:4px solid var(--accent)}
.earth3 .card.rd{border-top-color:#ff8a65}
.earth3 .card.gl{border-top-color:var(--success)}
.sdg{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px;font-weight:700;font-size:13px;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
@media (max-width:600px){
  #hud{padding:4px 6px 0}
  #hud .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
  .meter{min-width:0;padding:3px 6px;border-radius:9px}.meter .lbl{font-size:11px}.meter .bar{height:5px;margin-top:2px}.meter .st{display:none}
  #hudR{margin-left:0;width:100%;justify-content:space-between;gap:4px}
  .chip{min-height:38px;padding:4px 8px;font-size:13px}
  #mini{width:112px;height:90px;top:128px;right:6px;bottom:auto}
  #zoomc{top:224px;right:6px;bottom:auto;flex-direction:row}
  #m_life{grid-column:span 2}
  #hud .meters{grid-auto-rows:auto}
  #hint{top:128px;bottom:auto;left:6px;transform:none;max-width:calc(100% - 132px);font-size:13px;padding:6px 8px}
  #toasts{top:auto;bottom:200px;left:6px}
  #prompt{bottom:190px}
  #btnE{bottom:40px;right:20px}
  #btnF{bottom:44px;right:112px;width:56px;height:56px}
  #eva{right:auto;left:6px;top:158px;width:min(206px,56vw);padding:5px 7px;gap:3px}
  #eva .xr b{min-width:46px}
  #app.eva #hint{display:none}
