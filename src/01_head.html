<title>Space Explorer</title>
<style>
/* ===== Design tokens (roles). Contrast checked with tests/contrast.js ===== */
:root{
  --bg:#070b1a; --surface:#111a33; --surface-2:#18244a; --border:#2c3d70; --border-input:#5a73b8;
  --text:#eef3ff; --text-muted:#b4c0e0; --accent:#38d6ff; --on-accent:#04121c;
  --danger:#ff6b6b; --warning:#ffc24a; --info:#6fb3ff; --success:#5fe39a;
  --radius:10px; --radius-lg:16px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-xxl:40px;
  --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(var(--fs-md)*var(--scale));overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0}
#layer{position:absolute;inset:0;z-index:20;pointer-events:none}#layer>*{pointer-events:auto}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#02040c}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Buttons ===== */
.btn{appearance:none;border:2px solid var(--border-input);background:var(--surface-2);border-radius:var(--radius);padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;line-height:1.2;transition:transform .08s,background .15s}
.btn:hover{background:#22315f}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:#7fe6ff}
.btn.danger{border-color:var(--danger);color:#ffd9d9}
.btn.sm{min-height:36px;padding:6px 10px;font-size:var(--fs-sm)}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--text-muted)}
.small{font-size:var(--fs-sm)}
.tag{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:var(--fs-sm);border:1px solid var(--border-input);background:var(--surface)}
.tag.crit{border-color:var(--danger);color:#ffd2d2}
.tag.warn{border-color:var(--warning);color:#ffe7b3}
.tag.info{border-color:var(--info);color:#d6e8ff}
.tag.ok{border-color:var(--success);color:#cbf7dd}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.card h3{margin:0 0 8px;font-size:var(--fs-lg)}
h2{font-size:var(--fs-xl);margin:0 0 10px}
p{line-height:1.45;margin:6px 0}
ul{margin:6px 0;padding-left:20px;line-height:1.45}
label{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
select{background:var(--surface-2);border:2px solid var(--border-input);border-radius:var(--radius);padding:8px;min-height:44px}

/* ===== HUD ===== */
/* ===== EARTHLINK RADIO ===== */
.er{position:absolute;right:8px;top:112px;bottom:8px;width:min(420px,calc(100vw - 16px));z-index:30;display:flex;flex-direction:column;pointer-events:auto}
.er.hidden{display:none}
.er-dev{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:linear-gradient(160deg,#1a2342,#0c1228 60%,#131a36);border:2px solid #3b4a86;border-radius:22px;padding:14px 12px 10px;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 0 2px rgba(127,211,255,.08)}
.er.er-in .er-dev{animation:erOpen .45s cubic-bezier(.2,.9,.3,1)}
@keyframes erOpen{0%{transform:translate(40px,-30px) scale(.55);opacity:0;filter:brightness(2)}60%{opacity:1}100%{transform:none;filter:none}}
.er-ant{position:absolute;right:26px;top:-22px;width:10px;height:30px;border-radius:5px 5px 0 0;background:linear-gradient(#cfd5e3,#6a7390);border:2px solid #3b4a86;border-bottom:none}
.er-head{display:flex;align-items:center;gap:8px;padding-right:2px}

.mcard,.dcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px;padding:16px 12px;border-radius:18px;border:2px solid var(--border-input);background:linear-gradient(160deg,rgba(30,40,100,.7),rgba(20,16,56,.8));color:var(--text);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.mcard:hover,.dcard:hover{transform:translateY(-4px);border-color:#a98bff;box-shadow:0 8px 28px rgba(110,90,255,.35)}
.mcard[aria-pressed=true],.dcard[aria-pressed=true]{border-color:#38d6ff;box-shadow:0 0 0 3px rgba(56,214,255,.3),0 0 30px rgba(120,120,255,.5)}
.mico{display:block;line-height:0;filter:drop-shadow(0 0 12px rgba(150,170,255,.6))}.mico svg{display:block;max-width:100%}
.mcard b,.dcard b{font-size:20px}
.dtag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:20px;background:rgba(56,214,255,.16);color:var(--accent)}
.wiz-nav{justify-content:center;margin-top:16px}
.wiz-big{min-width:200px;min-height:56px;font-size:19px}
@media (max-width:640px){.mgrid,.dgrid{grid-template-columns:1fr}.mcard,.dcard{min-height:0;flex-direction:row;text-align:left;gap:12px;padding:12px}.mico{flex:0 0 auto}.mico svg{width:42px;height:42px}.ld-pl svg{width:30px;height:30px}.ld-ship svg{width:48px;height:20px}.wiz-steps li span{display:none}.wiz-steps li{padding:6px}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px;padding-right:44px}
.tabs .btn[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pbar{height:12px;background:#26345e;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.delta-up{color:var(--success)} .delta-down{color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th,td{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.mg-wrap{position:relative;width:100%;max-width:720px;margin:0 auto}
.mg-wrap canvas{width:100%;height:auto;background:#050915;border-radius:12px;border:1px solid var(--border);display:block;touch-action:none}
.why{border-left:4px solid var(--info);padding-left:10px}
.earth3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.earth3 .card{border-top:4px solid var(--accent)}
.earth3 .card.rd{border-top-color:#ff8a65}
.earth3 .card.gl{border-top-color:var(--success)}
.sdg{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px;font-weight:700;font-size:13px;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
@media (max-width:600px){
  #hud{padding:4px 6px 0}
  #hud .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
  .meter{min-width:0;padding:3px 6px;border-radius:9px}.meter .lbl{font-size:11px}.meter .bar{height:5px;margin-top:2px}.meter .st{display:none}
  #hudR{margin-left:0;width:100%;justify-content:space-between;gap:4px}
  .chip{min-height:38px;padding:4px 8px;font-size:13px}
  #mini{width:112px;height:90px;top:128px;right:6px;bottom:auto}
  #zoomc{top:224px;right:6px;bottom:auto;flex-direction:row}
  #m_life{grid-column:span 2}
  #hud .meters{grid-auto-rows:auto}
  #hint{top:128px;bottom:auto;left:6px;transform:none;max-width:calc(100% - 132px);font-size:13px;padding:6px 8px}
  #toasts{top:auto;bottom:200px;left:6px}
  #prompt{bottom:190px}
  #btnE{bottom:40px;right:20px}
  #btnF{bottom:44px;right:112px;width:56px;height:56px}
  #eva{right:auto;left:6px;top:158px;width:min(206px,56vw);padding:5px 7px;gap:3px}
  #eva .xr b{min-width:46px}
  #app.eva #hint{display:none}
  #app.eva #toasts{top:368px;bottom:auto;max-width:calc(100% - 64px)}
  #app.eva #toasts > :nth-child(n+3){display:none}
  #xtools{left:auto;right:6px;top:272px;bottom:auto;gap:3px}#xtools .btn{min-width:40px;min-height:40px;font-size:17px}
  #xcard{bottom:312px;left:6px;right:6px;width:auto;transform:none}
  #joy{left:16px;bottom:24px}
  .panel{padding:12px}
}
#radio{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(680px,calc(100vw - 16px));display:flex;gap:10px;align-items:flex-start;background:rgba(10,16,36,.96);border:2px solid var(--info);border-radius:14px;padding:10px;box-shadow:var(--shadow);z-index:5;animation:slidein .25s}
#radio.crit{border-color:var(--danger)} #radio.warn{border-color:var(--warning)} #radio.ok{border-color:var(--success)}
.radio-title{font-weight:800;font-size:16px}
.talk .bubble{background:var(--surface-2);border:1px solid var(--border-input);border-radius:14px;padding:12px;font-size:17px;line-height:1.45}
@media (max-width:600px){#radio{bottom:186px;padding:8px;gap:8px;font-size:13px}#radio .r-desc,#radio .r-cons,#radio .muted{display:none}#radio canvas{width:44px!important;height:44px!important}.radio-title{font-size:14px}#radio .btn.sm{min-height:34px;padding:4px 8px;font-size:12px}}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto;margin-right:.2em;overflow:visible}
button .ico:only-child,.chip .ico:only-child,.meter .ico:only-child{margin:0}
details.more{margin:6px 0;border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;background:var(--surface)}
details.more summary{cursor:pointer;font-size:var(--fs-sm);color:var(--text-muted);min-height:32px;display:flex;align-items:center}
details.more p{margin:6px 0}
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mt .choice h3{margin:6px 0}
.meter .trend{font-size:11px;margin-left:4px}
.meter .sub{display:flex;gap:6px;margin-top:3px}.meter .sub .bar{flex:1;margin-top:0}
.sev-word{font-weight:700}
.ico-lg{width:2.2em;height:2.2em;display:block;margin:0 auto 6px}
.mt button.btn{text-align:center!important}
canvas.spark{width:100%;height:46px;display:block}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
.mapcv{width:100%;max-width:760px;height:auto;background:#070b18;border-radius:10px;touch-action:none;cursor:grab;display:block;margin:0 auto}
.mapinfo{min-height:96px}
#subs{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;max-width:min(720px,92vw);background:rgba(8,12,28,.94);border:1px solid var(--border);border-radius:12px;padding:8px 12px;z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;pointer-events:auto}
#subs.hidden{display:none}
</style>
</head>
