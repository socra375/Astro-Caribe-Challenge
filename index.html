<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Junior Astronaut Mission Trainer: simulador educativo 2D para aprender a gestionar un puesto avanzado en la Luna o Marte.">
<title>Junior Astronaut Mission Trainer</title>
<style>
/* ===== Design tokens (roles). Contrast checked with tests/contrast.js ===== */
:root{
  --bg:#070b1a; --surface:#111a33; --surface-2:#18244a; --border:#2c3d70; --border-input:#5a73b8;
  --text:#eef3ff; --text-muted:#b4c0e0; --accent:#38d6ff; --on-accent:#04121c;
  --danger:#ff6b6b; --warning:#ffc24a; --info:#6fb3ff; --success:#5fe39a;
  --radius:10px; --radius-lg:16px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-xxl:40px;
  --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(var(--fs-md)*var(--scale));overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#02040c}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Buttons ===== */
.btn{appearance:none;border:2px solid var(--border-input);background:var(--surface-2);border-radius:var(--radius);padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;line-height:1.2;transition:transform .08s,background .15s}
.btn:hover{background:#22315f}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:#7fe6ff}
.btn.danger{border-color:var(--danger);color:#ffd9d9}
.btn.sm{min-height:36px;padding:6px 10px;font-size:var(--fs-sm)}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--text-muted)}
.small{font-size:var(--fs-sm)}
.tag{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:var(--fs-sm);border:1px solid var(--border-input);background:var(--surface)}
.tag.crit{border-color:var(--danger);color:#ffd2d2}
.tag.warn{border-color:var(--warning);color:#ffe7b3}
.tag.info{border-color:var(--info);color:#d6e8ff}
.tag.ok{border-color:var(--success);color:#cbf7dd}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.card h3{margin:0 0 8px;font-size:var(--fs-lg)}
h2{font-size:var(--fs-xl);margin:0 0 10px}
p{line-height:1.45;margin:6px 0}
ul{margin:6px 0;padding-left:20px;line-height:1.45}
label{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
select{background:var(--surface-2);border:2px solid var(--border-input);border-radius:var(--radius);padding:8px;min-height:44px}

/* ===== HUD ===== */
#hud{position:absolute;left:0;right:0;top:0;padding:8px max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
#hud .meters{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.meter{background:rgba(10,16,36,.88);border:1px solid var(--border);border-radius:12px;padding:5px 8px;min-width:104px;cursor:pointer}
.meter .lbl{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700}
.meter .bar{height:8px;background:#26345e;border-radius:6px;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;background:var(--success);border-radius:6px;transition:width .3s}
.meter.warn{border-color:var(--warning)} .meter.warn .bar i{background:var(--warning)}
.meter.crit{border-color:var(--danger);animation:pulse 1s infinite} .meter.crit .bar i{background:var(--danger)}
.meter .st{font-size:11px;color:var(--text-muted)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,107,107,.35)}}
#hudR{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(10,16,36,.88);border:1px solid var(--border);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;min-height:40px;display:flex;align-items:center;gap:6px}
.chip.btn{padding:6px 10px}
#mini{position:absolute;right:8px;bottom:8px;width:190px;height:150px;border:1px solid var(--border);border-radius:12px;background:rgba(5,8,20,.85)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:min(560px,80vw);background:rgba(10,16,36,.92);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:15px;text-align:center;pointer-events:none}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:64px}
#prompt .btn{font-size:18px;box-shadow:var(--shadow)}
#toasts{position:absolute;left:8px;top:120px;display:flex;flex-direction:column;gap:6px;max-width:min(380px,70vw);pointer-events:none}
.toast{background:rgba(10,16,36,.95);border-left:6px solid var(--info);border-radius:10px;padding:8px 10px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;animation:slidein .25s}
.toast.crit{border-color:var(--danger)} .toast.warn{border-color:var(--warning)} .toast.ok{border-color:var(--success)}
.toast b{display:block}
@keyframes slidein{from{transform:translateX(-20px);opacity:0}}

/* ===== Touch ===== */
#touch{position:absolute;inset:auto 0 0 0;height:0}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(56,214,255,.12);border:2px solid rgba(56,214,255,.5)}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(56,214,255,.6)}
#btnE{position:absolute;right:24px;bottom:180px;width:84px;height:84px;border-radius:50%;font-size:24px}

/* ===== Screens & modals ===== */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 30% 20%,#1a2a5c 0,#070b1a 60%);overflow:auto}
.screen.dim{background:rgba(3,6,16,.72)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;position:relative}
.panel.narrow{width:min(560px,100%)}
.panel .close{position:absolute;right:10px;top:10px}
.title-big{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:.5px;margin:0;background:linear-gradient(90deg,#38d6ff,#a98bff,#5fe39a);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.choice{border:2px solid var(--border-input);background:var(--surface-2);border-radius:var(--radius-lg);padding:12px;text-align:left;cursor:pointer;min-height:44px}
.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,214,255,.25)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px;padding-right:44px}
.tabs .btn[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pbar{height:12px;background:#26345e;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.delta-up{color:var(--success)} .delta-down{color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th,td{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.mg-wrap{position:relative;width:100%;max-width:720px;margin:0 auto}
.mg-wrap canvas{width:100%;height:auto;background:#050915;border-radius:12px;border:1px solid var(--border);display:block;touch-action:none}
.why{border-left:4px solid var(--info);padding-left:10px}
.earth3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.earth3 .card{border-top:4px solid var(--accent)}
.earth3 .card.rd{border-top-color:#ff8a65}
.earth3 .card.gl{border-top-color:var(--success)}
.sdg{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px;font-weight:700;font-size:13px;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
@media (max-width:600px){
  #hud{padding:4px 6px 0}
  #hud .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
  .meter{min-width:0;padding:3px 6px;border-radius:9px}.meter .lbl{font-size:11px}.meter .bar{height:5px;margin-top:2px}.meter .st{display:none}
  #hudR{margin-left:0;width:100%;justify-content:space-between;gap:4px}
  .chip{min-height:38px;padding:4px 8px;font-size:13px}
  #mini{width:112px;height:90px;top:128px;right:6px;bottom:auto}
  #hint{top:128px;bottom:auto;left:6px;transform:none;max-width:calc(100% - 132px);font-size:13px;padding:6px 8px}
  #toasts{top:auto;bottom:200px;left:6px}
  #prompt{bottom:190px}
  #btnE{bottom:40px;right:20px}
  #joy{left:16px;bottom:24px}
  .panel{padding:12px}
}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Vista cenital del puesto avanzado"></canvas>
  <div id="hud" class="hidden">
    <div class="meters" id="meters"></div>
    <div id="hudR">
      <div class="chip" id="clock" aria-live="off">D1 00:00</div>
      <button class="chip btn" id="bSpeed" title="Velocidad">x1</button>
      <button class="chip btn" id="bAlerts" title="Alertas">🔔 0</button>
      <button class="chip btn" id="bPause" title="Pausa (P)" aria-label="Pausa">❚❚</button>
      <button class="chip btn" id="bMute" title="Silencio (M)">🔊</button>
      <button class="chip btn" id="bMenu" title="Menú">☰</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="hint" class="hidden"></div>
  <div id="prompt" class="hidden"><button class="btn primary" id="actBtn"></button></div>
  <div id="touch" class="hidden"><div id="joy"><div id="knob"></div></div><button class="btn primary" id="btnE" aria-label="Interactuar">E</button></div>
  <canvas id="mini" class="hidden" width="380" height="300" aria-hidden="true"></canvas>
  <div id="layer"></div>
</div>

    const recEff = (sy.rec.mode === 'max' ? P.REC_EFF_MAX : P.REC_EFF_ECO) * lf.rec * (sy.rec.h / 100) * M.recMul;
    const waterOk = r.water.v > 0.05;
    let o2rate = P.O2GEN_MAX * sy.o2.lvl * lf.o2 * (sy.o2.h / 100) * (waterOk ? 1 : 0);
    const irrigBase = 0.08 * sy.gh.irrig * (sy.gh.drip ? 0.55 : 1) * planted * (lf.pumps || 0);
    const irrig = waterOk ? irrigBase : 0;
    const elec = P.O2_STOICH_WATER * o2rate;
    const isruL = sy.isru.on ? P.ISRU_LPH * (lf.isru || 0) * (sy.isru.h / 100) : 0;
    const recovered = W * recEff + irrig * 0.3 * recEff + isruL; // condensación del riego + hielo extraído
    r.water.cons = W + elec + irrig; r.water.prod = recovered;
    r.water.v += (recovered - W - elec - irrig) * h;
    S.st.waterUsed += (W + elec + irrig) * h; S.st.waterRec += recovered * h;

    /* --- Oxígeno --- */
    r.o2.prod = o2rate; r.o2.cons = o2use + leakO2;
    r.o2.v += (o2rate - o2use - leakO2) * h;
    let concT = 20.9 - 0.6 * sy.o2.calib;
    if (r.o2.v <= 0.05) concT -= 6 * (1 - clamp(o2rate / Math.max(0.001, o2use), 0, 1));
    sy.o2.conc += (concT - sy.o2.conc) * Math.min(1, 0.2 * h);
    sy.o2.conc = clamp(sy.o2.conc, 10, 30);

    /* --- Cultivos --- */
    const agri = bonus(S, 'agri') ? 1.15 : 1;
    const lightSup = clamp(sy.gh.lights * S.cap.gh * (lf.lights || 0), 0, 1);
    const waterSup = waterOk ? clamp(sy.gh.irrig * (lf.pumps || 0), 0, 1) : 0;
    for (let i = 0; i < S.beds.length; i++) {
      const b = S.beds[i];
      if (!b.crop) continue;
      const c = CROPS[b.crop];
      const lF = Math.min(1, lightSup / c.light), wF = Math.min(1, waterSup / c.water);
      const tF = clamp(1 - Math.abs(sy.thermal.T - c.T) / 9, 0, 1);
      if (b.prog < 1) b.prog = clamp(b.prog + (h / P.CROP_CYCLE_H) * lF * wF * tF * agri * (0.4 + 0.6 * b.hp / 100), 0, 1);
      const stress = lF < 0.3 || wF < 0.3 || tF < 0.3;
      b.hp = clamp(b.hp + (stress ? -0.8 : 0.3) * h - (M.blight ? 0.25 * h : 0) - (b.prog >= 1 ? 0.05 * h : 0), 0, 100);
      if (b.hp <= 0) { b.crop = null; b.prog = 0; b.hp = 100; log(S, 'warn', 'crop.dead', { bed: i + 1 }); S.st.mistakes.cropDead = (S.st.mistakes.cropDead || 0) + 1; }
    }

    /* --- Alimentos --- */
    const fUse = S.N * (P.FOOD_PER_PERSON_DAY / 24) * df.cons;
    r.food.cons = fUse; r.food.prod = 0;
    r.food.v -= fUse * h; S.st.foodCons += fUse * h;
    r.waste.prod = S.N * (P.WASTE_PER_PERSON_DAY / 24); r.waste.v += r.waste.prod * h; // envases y residuos sólidos

    /* --- Radiación --- */
    const eff = shieldEff(S);
    r.rad.v = eff * 100;
    const gcr = sc.gcr / 24;
    let cap = sy.shield.cap;
    const player = S.crew[0];
    if (player.zone === 'shelter') { if (cap > 0) cap--; else player.zone = 'hab'; }
    for (let i = 1; i < S.crew.length; i++) {
      const c = S.crew[i];
      if (S.proto && cap > 0) { c.zone = 'shelter'; cap--; } else c.zone = 'hab';
    }
    let maxD = 0;
    for (const c of S.crew) {
      const e = c.zone === 'shelter' ? Math.min(1, eff + 0.35) : c.zone === 'outside' ? 0.05 : eff;
      c.rate = gcr * (1 - 0.3 * e) + M.spe * (1 - 0.9 * e);
      c.dose += c.rate * h;
      maxD = Math.max(maxD, c.dose);
    }
    S.st.maxDose = maxD;

    /* --- Bienestar --- */
    const ai = activeInc(S).filter((i) => S.t >= i.from);
    const nCrit = ai.filter((i) => i.sev === 'crit').length, nWarn = ai.filter((i) => i.sev === 'warn').length;
    const T = sy.thermal.T, conc = sy.o2.conc;
    const q = [clamp(1 - Math.abs(T - 21) / 10, 0, 1), clamp((sy.press.P - 80) / 21, 0, 1),
      conc >= P.O2_BAND[0] && conc <= P.O2_BAND[1] ? 1 : clamp(1 - Math.abs(conc - 21) / 6, 0, 1),
      clamp(pct(r.food) / 0.25, 0, 1), clamp(pct(r.water) / 0.2, 0, 1), lf.therm];
    const hq = q.reduce((a, b) => a + b, 0) / q.length;
    const medic = bonus(S, 'medic') ? 6 : 0;
    const mT = 30 + 58 * hq - nCrit * 6 - nWarn * 2 + medic;
    S.morale = clamp(S.morale + (mT - S.morale) * Math.min(1, 0.04 * h), 0, 100);
    S.rest = clamp(S.rest + (28 + 66 * hq - S.rest) * Math.min(1, 0.05 * h), 0, 100);
    r.well.v = 0.6 * S.morale + 0.4 * S.rest;
    S.hq = hq;

    /* --- Trabajos (construcción, análisis) --- */
    const eng = bonus(S, 'engineer') ? 1.3 : 1, sci = bonus(S, 'scientist') ? 1.5 : 1;
    for (const j of S.jobs) {
      const pf = (j.kind === 'analyze' || j.kind === 'experiment') ? (lf.lab || 0) * sci : (lf.jobs || 0) * eng * df.repair;
      j.h -= h * pf;
    }
    const done = S.jobs.filter((j) => j.h <= 0);
    S.jobs = S.jobs.filter((j) => j.h > 0);
    for (const j of done) finishJob(S, j);

    /* --- Ingeniero: reparación autónoma lenta --- */
    if (bonus(S, 'engineer')) {
      const tgt = activeInc(S).filter((i) => i.fix && S.t >= i.from).sort((a, b) => (a.sev === 'crit' ? -1 : 1) - (b.sev === 'crit' ? -1 : 1))[0];
      if (tgt) { tgt.prog = clamp(tgt.prog + 1.6 * h * df.repair, 0, 100); tgt.bot = true; if (tgt.prog >= 100) resolveInc(S, tgt, 'engineer'); }
    }

    /* --- Ciclo de incidentes --- */
    for (const i of S.inc) {
      if (i.res) continue;
      if (i.until != null && S.t >= i.until) { resolveInc(S, i, 'expired'); continue; }
      if (i.fix && !i.esc && S.t - i.t0 > 36 * df.grace) { i.esc = true; if (i.sev !== 'crit') { i.sev = i.sev === 'info' ? 'warn' : 'crit'; log(S, i.sev, 'esc', { id: i.id, type: i.type }); } }
    }
    if (nCrit) S.st.critH += h;
    spawn(S, h);

    /* --- Comunicaciones --- */
    commsStep(S, M);

    /* --- Misiones --- */
    missionsStep(S, h);

    normalize(S);
    endings(S, h, M);
    derive(S);
  }

  function normalize(S) {
    for (const k in S.r) { const x = S.r[k]; x.v = clamp(fin(x.v, 0), 0, x.max); }
    const s = S.sys;
    for (const k in s) if (s[k].h != null) s[k].h = clamp(fin(s[k].h, 0), 0, 100);
    s.o2.lvl = clamp(fin(s.o2.lvl, 0.5), 0, 1); s.reactor.lvl = clamp(fin(s.reactor.lvl, 0.8), 0, 1);
    s.gh.lights = clamp(fin(s.gh.lights, 0.5), 0, 1); s.gh.irrig = clamp(fin(s.gh.irrig, 0.5), 0, 1);
    s.thermal.T = clamp(fin(s.thermal.T, 21), -60, 40); s.shield.lvl = clamp(Math.round(s.shield.lvl), 0, 3);
    s.shield.cap = clamp(Math.round(s.shield.cap), 0, 5);
    S.morale = clamp(fin(S.morale, 50), 0, 100); S.rest = clamp(fin(S.rest, 50), 0, 100);
    S.samples = Math.max(0, Math.round(S.samples));
  }

  /* ---------- Finales (no violentos) ---------- */
  function endings(S, h, M) {
    if (S.ended) return;
    const r = S.r;
    const end = (kind, reason) => { S.ended = { kind, reason, t: S.t }; log(S, kind === 'victory' ? 'ok' : 'crit', 'end.' + reason, {}); };
    if (r.o2.v <= 0 && S.sys.o2.conc < 17) return end('abort', 'o2');
    S.z.water = r.water.v <= 0.01 ? S.z.water + h : 0; if (S.z.water >= 12) return end('abort', 'water');
    S.z.food = r.food.v <= 0.01 ? S.z.food + h : 0; if (S.z.food >= 72) return end('abort', 'food');
    S.z.power = r.power.v <= 0.01 && (S.lf.o2 < 0.3 || S.lf.therm < 0.3) ? S.z.power + h : 0; if (S.z.power >= 24) return end('abort', 'power');
    S.z.press = S.sys.press.P < 60 ? S.z.press + h : 0; if (S.z.press >= 6) return end('abort', 'press');
    S.z.well = r.well.v < 10 ? S.z.well + h : 0; if (S.z.well >= 24) return end('abort', 'well');
    if (S.st.maxDose >= S.limit) return end('abort', 'dose');
    if (S.inc.some((i) => !i.res && i.fix && i.sev === 'crit' && S.t - i.t0 > 72)) return end('abort', 'inc');
    let all = true; for (let i = 1; i <= 7; i++) if (S.m[i].st !== 'done') all = false;
    if (all && !activeInc(S).some((i) => i.sev === 'crit' && S.t >= i.from)) end('victory', 'all');
  }

  function derive(S) {
    const d = S.d;
    d.o2 = pct(S.r.o2); d.water = pct(S.r.water); d.power = pct(S.r.power); d.food = pct(S.r.food); d.well = S.r.well.v / 100;
    d.rad = S.r.rad.v / 100; d.dose = S.st.maxDose; d.doseF = S.st.maxDose / S.limit;
    d.rec = (S.sys.rec.mode === 'max' ? P.REC_EFF_MAX : P.REC_EFF_ECO) * (S.lf.rec == null ? 1 : S.lf.rec) * (S.sys.rec.h / 100) * ((S.mods && S.mods.recMul) || 1);
    d.net = (S.pw.gen || 0) - (S.pw.demand || 0);
    d.day = Math.floor(S.t / 24) + 1; d.hour = S.t % 24;
  }

  /* ---------- Trabajos ---------- */
  function finishJob(S, j) {
    const sy = S.sys;
    if (j.kind === 'shield') { sy.shield.lvl = Math.min(3, sy.shield.lvl + 1); sy.shield.h = Math.max(sy.shield.h, 90); log(S, 'ok', 'job.shield', { lvl: sy.shield.lvl }); }
    if (j.kind === 'shelter') { sy.shield.cap = Math.min(5, sy.shield.cap + 1); log(S, 'ok', 'job.shelter', { cap: sy.shield.cap }); }
    if (j.kind === 'analyze') { S.science += 12; S.pts += 15; log(S, 'ok', 'job.analyze', {}); }
    if (j.kind === 'experiment') { S.science += 8; S.morale += 4; log(S, 'ok', 'job.experiment', {}); }
    if (j.kind === 'recycle') { S.r.mat.v += 5; S.st.good.recycle = (S.st.good.recycle || 0) + 1; log(S, 'ok', 'job.recycle', {}); }
    if (j.kind === 'maint') { sy[j.sys].h = Math.min(100, sy[j.sys].h + 35); log(S, 'ok', 'job.maint', { sys: j.sys }); }
  }

  /* ---------- Decisiones con panel de consecuencias ---------- */
  const DEC = {
    lights: (S, p) => { S.sys.gh.lights = clamp(+p.v, 0, 1); },
    irrig: (S, p) => { S.sys.gh.irrig = clamp(+p.v, 0, 1); },
    reactor: (S, p) => { S.sys.reactor.lvl = clamp(+p.v, 0, 1); },
    o2lvl: (S, p) => { S.sys.o2.auto = !!p.auto; if (!p.auto) S.sys.o2.lvl = clamp(+p.v, 0, 1); },
    isru: (S, p) => { S.sys.isru.on = !!p.v; },
    recmode: (S, p) => { S.sys.rec.mode = p.v === 'max' ? 'max' : 'eco'; },
    emergency: (S, p) => { S.emergency = !!p.v; },
    proto: (S, p) => { S.proto = !!p.v; },
    shield: (S) => {
      if (S.sys.shield.lvl >= 3 || S.jobs.some((j) => j.kind === 'shield')) return 'busy';
      if (S.r.mat.v < 14) return 'nomat';
      S.r.mat.v -= 14; S.jobs.push({ kind: 'shield', h: 6, kw: 0.8 });
    },
    shelter: (S) => {
      if (S.sys.shield.cap >= 5 || S.jobs.some((j) => j.kind === 'shelter')) return 'busy';
      if (S.r.mat.v < 8) return 'nomat';
      S.r.mat.v -= 8; S.jobs.push({ kind: 'shelter', h: 4, kw: 0.5 });
    },
    maint: (S, p) => {
      if (S.jobs.some((j) => j.kind === 'maint')) return 'busy';
      if (S.r.mat.v < 4) return 'nomat';
      S.r.mat.v -= 4; S.jobs.push({ kind: 'maint', h: 3, kw: 0.6, sys: p.sys || 'reactor' });
    },
    recycle: (S) => {
      if (S.jobs.some((j) => j.kind === 'recycle')) return 'busy';
      if (S.r.waste.v < 6) return 'nowaste';
      S.r.waste.v -= 6; S.jobs.push({ kind: 'recycle', h: 3, kw: 0.8 });
    },
    analyze: (S) => {
      if (S.samples < 1) return 'nosample';
      if (S.jobs.some((j) => j.kind === 'analyze')) return 'busy';
      S.samples--; S.jobs.push({ kind: 'analyze', h: 3, kw: 0 });
    },
    experiment: (S) => {
      if (S.jobs.some((j) => j.kind === 'experiment')) return 'busy';
      if (S.r.water.v < 3) return 'nowater';
      S.r.water.v -= 2; S.jobs.push({ kind: 'experiment', h: 5, kw: 0 });
    },
    plant: (S, p) => {
      const b = S.beds[p.bed]; if (!b || b.crop || !CROPS[p.crop]) return 'busy';
      if (S.r.water.v < 2) return 'nowater';
      S.r.water.v -= 1.5; b.crop = p.crop; b.prog = 0; b.hp = 100;
    },
    eva: (S) => {
      if (S.r.o2.v < 0.5) return 'err';
      S.r.o2.v -= 0.2; S.samples++; S.st.samplesTot++; S.r.mat.v += 1; S.pts += 5;
    },
    sleep: (S) => { S.rest = clamp(S.rest + 30, 0, 100); S.morale = clamp(S.morale + 4, 0, 100); step(S, 4); },
    rec: (S) => { S.morale = clamp(S.morale + 9, 0, 100); step(S, 2); },
    wait: (S, p) => { step(S, clamp(+p.h || 1, 0.5, 24)); }
  };
  function decide(S, id, p) {
    const f = DEC[id]; if (!f) return { ok: false, err: 'unknown' };
    const err = f(S, p || {});
    if (err) return { ok: false, err };
    normalize(S); derive(S);
    S.st.good['dec_' + id] = (S.st.good['dec_' + id] || 0) + 1;
    return { ok: true };
  }
  function snapshot(S) {
    return { o2: S.r.o2.v, water: S.r.water.v, power: S.r.power.v, food: S.r.food.v, mat: S.r.mat.v, dose: S.st.maxDose, well: S.r.well.v, rad: S.r.rad.v,
      shelter: S.sys.shield.cap, net: (S.pw.gen || 0) - (S.pw.demand || 0) };
  }
  /** Proyección determinista a 12 h (sin eventos aleatorios) con y sin la decisión. */
  function preview(S, id, p, hours) {
    hours = hours || 12;
    const base = JSON.parse(JSON.stringify(S)); base.noEv = true; base.ended = null; base.log = [];
    const alt = JSON.parse(JSON.stringify(base));
    const now = snapshot(S);
    if (id === 'sleep' || id === 'rec' || id === 'wait') {
      const res = decide(alt, id, p);
      const dur = id === 'sleep' ? 4 : id === 'rec' ? 2 : clamp(+p.h || 1, 0.5, 24);
      step(base, dur);
      return { ok: res.ok, err: res.err, now, a: snapshot(base), b: snapshot(alt), hours: dur };
    }
    const res = decide(alt, id, p);
    step(base, hours); step(alt, hours);
    return { ok: res.ok, err: res.err, now, a: snapshot(base), b: snapshot(alt), hours };
  }

  function harvest(S, i) {
    const b = S.beds[i]; if (!b || !b.crop || b.prog < 1) return 0;
    const y = CROPS[b.crop].y * (b.hp / 100);
    S.r.food.v += y; S.st.foodProd += y; S.st.harvested += y; S.st.crops[b.crop] = (S.st.crops[b.crop] || 0) + 1;
    const m6 = S.m[6]; if (m6.st === 'active') { m6.data.kg = (m6.data.kg || 0) + y; (m6.data.types = m6.data.types || {})[b.crop] = 1; }
    b.crop = null; b.prog = 0; b.hp = 100;
    normalize(S); derive(S);
    log(S, 'ok', 'crop.harvest', { kg: Math.round(y * 100) / 100 });
    return y;
  }

  /* ---------- Minijuegos -> sistemas ---------- */
  function mini(S, kind, res) {
    const ok = !!res.ok, sc = clamp(fin(res.score, 0), 0, 1);
    const sy = S.sys;
    if (ok) S.pts += Math.round(20 + 30 * sc);
    S.st[ok ? 'good' : 'mistakes']['mg_' + kind] = (S.st[ok ? 'good' : 'mistakes']['mg_' + kind] || 0) + 1;
    switch (kind) {
      case 'wiring':
        if (res.inc) repair(S, res.inc, ok ? 70 + 30 * sc : 25);
        else if (res.sys && sy[res.sys]) sy[res.sys].h = Math.min(100, sy[res.sys].h + (ok ? 25 * (0.5 + sc / 2) : 5));
        break;
      case 'balance':
        if (ok) { S.cap.gh = clamp(fin(res.gh, 1), 0.2, 1); S.cap.lab = clamp(fin(res.lab, 1), 0, 1); S.cap.comms = clamp(fin(res.comms, 1), 0.5, 1); }
        break;
      case 'o2':
        if (ok) { sy.o2.calib = 0; sy.o2.h = Math.min(100, sy.o2.h + 12); const d = S.inc.find((i) => !i.res && i.type === 'sensor_drift'); if (d) resolveInc(S, d, 'player'); }
        else sy.o2.calib *= 0.6;
        break;
      case 'solar':
        sy.solar.align = clamp(ok ? 0.85 + 0.15 * sc : Math.max(sy.solar.align, 0.7), 0, 1);
        if (ok) sy.solar.dust *= 0.3;
        break;
      case 'gh':
        S.beds.forEach((b) => { if (b.crop) b.hp = Math.min(100, b.hp + (ok ? 25 * sc + 5 : 3)); });
        if (ok) { sy.gh.drip = true; if (res.inc) repair(S, res.inc, 100); }
        break;
      case 'rover': {
        const n = Math.max(0, Math.round(fin(res.samples, 0)));
        S.samples += n; S.st.samplesTot += n; S.r.mat.v += fin(res.regolith, 0);
        sy.rover.h = clamp(sy.rover.h - fin(res.damage, 0), 10, 100); sy.rover.batt = clamp(fin(res.batt, 50), 0, 100); sy.rover.runs++;
        const m7 = S.m[7];
        if (m7.st === 'active' && ok && n >= m7.data.target) finishMission(S, 7, res.score > 0.75 ? 3 : 2);
        sy.rover.hint = false;
        break;
      }
    }
    normalize(S); derive(S);
  }

  /* ---------- Comunicaciones con retraso ---------- */
  function send(S, kind) {
    const ow = oneWay(S);
    const msg = { id: S.cm.seq++, kind, sent: S.t, arriveEarth: S.t + ow, reply: null, st: 'transit', snap: snapshot(S), stormSoon: S.inc.some((i) => i.type === 'solar_storm' && !i.res) };
    S.cm.q.push(msg);
    log(S, 'info', 'cm.sent', { kind, ow: Math.round(ow * 10) / 10 });
    return msg;
  }
  function commsStep(S, M) {
    const ow = oneWay(S);
    for (const m of S.cm.q) {
      if (M.commsDown && m.st !== 'done') { m.arriveEarth = Math.max(m.arriveEarth, S.t + 0.25); if (m.reply != null) m.reply = Math.max(m.reply, S.t + 0.25); continue; }
      if (m.st === 'transit' && S.t >= m.arriveEarth) { m.st = 'earth'; m.reply = S.t + 0.5 + ow; }
      else if (m.st === 'earth' && S.t >= m.reply) {
        m.st = 'done';
        S.cm.inbox.push({ id: m.id, kind: m.kind, t: S.t, sent: m.sent, snap: m.snap, stormSoon: m.stormSoon, read: false });
        if (m.kind === 'route') S.sys.rover.hint = true;
        if (S.m[7].st === 'active') S.m[7].data.comm = true;
        log(S, 'info', 'cm.recv', { kind: m.kind, rt: Math.round((S.t - m.sent) * 10) / 10 });
      }
    }
    S.cm.q = S.cm.q.filter((m) => m.st !== 'done');
    if (S.t >= S.cm.nextDaily && !M.commsDown) {
      S.cm.nextDaily += 24;
      S.cm.inbox.push({ id: S.cm.seq++, kind: 'daily', t: S.t, sent: S.t - ow, snap: snapshot(S), read: false, n: Math.floor(S.t / 24) });
    }
    if (S.cm.inbox.length > 40) S.cm.inbox.splice(0, S.cm.inbox.length - 40);
  }

  /* ---------- Misiones ---------- */
  const LIMIT = { 1: 72, 2: 72, 3: 999, 4: 999, 5: 120, 6: 336, 7: 999 };
  function startMission(S, id) {
    if (S.ended) return { ok: false, err: 'ended' };
    // La misión 6 (cultivo, 7 días) puede correr en paralelo con otra misión.
    if (id !== 6) for (let i = 1; i <= 7; i++) if (i !== 6 && S.m[i].st === 'active') return { ok: false, err: 'busy', id: i };
    if (S.m[id].st === 'active' || S.m[id].st === 'done') return { ok: false, err: 'state' };
    const m = S.m[id], df = DIFFS[S.diff];
    m.st = 'active'; m.att++; m.t0 = S.t; m.hold = 0; m.prog = 0; m.var = Math.floor(rnd(S) * 2); m.data = {};
    const r = S.r;
    switch (id) {
      case 1:
        r.o2.v = Math.min(r.o2.v, r.o2.max * 0.55); r.water.v = Math.min(r.water.v, r.water.max * 0.5);
        if (!hasActive(S, 'water_fail')) addInc(S, 'water_fail', { mission: 1 });
        break;
      case 2:

    ['ha', 'gh_t'], ['gh_t', 'gh_c'], ['gh_c', 'gh_b'], ['gh_b', 'v1'], ['v1', 'bay_a_d'], ['bay_a_d', 'bay_a'],

    ['hc', 're_t'], ['re_t', 're_m'], ['re_m', 're_c'], ['re_m', 're_b'], ['re_b', 'v3'], ['v3', 'bay_c_d'], ['bay_c_d', 'bay_c'],
    ['bay_a', 'bay_r'], ['bay_r', 'bay_b'], ['bay_r', 'bay_r2'], ['bay_b', 'bay_s'], ['bay_s', 'bay_c'], ['bay_s', 'sh_d'], ['sh_d', 'sh_c'], ['sh_c', 'sh_c2']];

  const BOTCOL = { engineer: '#ff9a3d', scientist: '#9a8cff', medic: '#ff6b9a', agri: '#3ddc84' };

  /* ---------- Colisión ---------- */

  /* ---------- Actualización ---------- */
  function update(dt, S, inp) {

      player.anim += dt * 8; player.stepT += dt;

      if (before === 0 && d.open > 0) Sfx.play('door');
      // No cerrar sobre alguien
      if (!want) for (const e of ents) if (Math.floor(e.y) === d.y && (Math.floor(e.x) === d.x || Math.floor(e.x) === d.x + 1)) d.open = Math.max(d.open, 0.7);
    }

    if (airlock.st === 'cycle_out' || airlock.st === 'cycle_in') {
      airlock.t += dt;

    } else {
      const rn = room(player.x, player.y);
      if (airlock.st === 'out' && rn === 'rad' && Math.abs(player.x - 30) < 2 && player.y > 43) cycleLock();

  function cycleLock() {

  function spawnP(x, y, c, k) {

  /* ---------- Interacción ---------- */

  function render(ctx, S, o) {

      for (let i = 0; i < n; i++) { const px = x + 10 + i * ((f.w * TS - 20) / (n - 1)), py = y + f.h * TS / 2; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, 3 + g * 8, 0, 7); ctx.fill(); }

      h('p', { class: 'small muted' }, es ? 'Las cifras dominicanas no se inventan: el juego usa explicaciones cualitativas y remite a ONE, MEM, Medio Ambiente, INDRHI, ONAMET y Agricultura.' : 'Dominican figures are not invented: the game uses qualitative explanations and points to official agencies.'));
    if (running) push(panel('🔭 ' + _('sources'), body)); else showScreen(h('div', { class: 'panel' }, btn(_('back'), mainMenu, 'sm'), h('h2', null, '🔭 ' + _('sources')), body));
  }

  /* =================== DATOS EN VIVO (opcional) =================== */
  function fetchDonki() {
    if (onlineTried) return; onlineTried = true;
    const cached = Store.get('donkiLive', null);
    if (cached && cached.items) donkiLive = cached;
    if (navigator.onLine === false || typeof fetch !== 'function') return;
    const end = new Date(), start = new Date(end.getTime() - 30 * 864e5);
    const d = (x) => x.toISOString().slice(0, 10);
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const to = setTimeout(() => ctl && ctl.abort(), 7000);
    fetch('https://api.nasa.gov/DONKI/FLR?startDate=' + d(start) + '&endDate=' + d(end) + '&api_key=DEMO_KEY', ctl ? { signal: ctl.signal } : {})
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((js) => {
        if (!Array.isArray(js)) return;
        const items = js.filter((x) => x && x.classType).map((x) => ({ cls: String(x.classType).slice(0, 8), date: String(x.beginTime || '').slice(0, 10), region: x.activeRegionNum || null }))
          .sort((a, b) => { const v = (c) => ({ X: 4, M: 3, C: 2, B: 1, A: 0 }[c[0]] || 0) * 100 + parseFloat(c.slice(1) || 0); return v(b.cls) - v(a.cls); });
        donkiLive = { fetched: new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC', items };
        Store.set('donkiLive', donkiLive);
        if (!running && layer.querySelector('.title-big')) mainMenu();
      })
      .catch(() => { /* sin conexión o límite de DEMO_KEY: se usan los datos locales */ })
      .finally(() => clearTimeout(to));
  }

  /* =================== INICIO =================== */
  function init() {
    applySettings(); resize(); window.addEventListener('resize', resize);
    setupTouch();
    isTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    $('#bSpeed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; updateHud(); Sfx.play('click'); });
    $('#bPause').addEventListener('click', () => togglePause());
    $('#bMute').addEventListener('click', () => toggleMute());
    $('#bMenu').addEventListener('click', () => pauseMenu());
    $('#bAlerts').addEventListener('click', () => openCmd('log'));
    $('#actBtn').addEventListener('click', () => interact());
    document.addEventListener('pointerdown', () => Sfx.init(), { once: true });
    if (/[?&]selftest\b/.test(location.search)) { mainMenu(); selfTestPanel(); }
    else mainMenu();
    fetchDonki();
    requestAnimationFrame(frame);
  }

  return { init, get scen() { return S ? S.scen : 'moon'; }, get S() { return S; }, _debug: { get mg() { return mgRun && mgRun.g; }, openConsole: (id) => openConsole({ id }), newRun, miniPlay, showReport, setSpeed: (v) => (speed = v), get running() { return running; } } };
})();
Game.init();

</script>
